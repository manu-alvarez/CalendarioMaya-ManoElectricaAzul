name: Calendario Maya Expo validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  expo-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Validate Expo application configuration
        run: npx expo config --type public --json > /tmp/expo-config.json
      - name: Export static web bundle
        run: npx expo export --platform web --output-dir dist
      - name: Verify export entry point
        run: test -s dist/index.html
